  - year: '2024'
    title: 建築資料アーカイブ・展示課題
    category: university
    type: 建築
    description: 比叡山山頂に建つ「比叡山回転展望閣」の設計資料アーカイブから、模型を製作し展示する課題。模型を作りながら、設計者村野藤吾が考えたことや竣工当時の姿やその後の変遷を想像した。
    image: /works/assets/thumbnail-archive.JPG
    image_alt: 建築資料アーカイブ・展示課題

  - year: '2023'
    title: 『映像的断片 2』
    category: orion
    type: 映像
    description: 生成AIを利用して抽象的な光を生成し繋げた実験的な映像作品。映像研究会オリヲン座の上映会にて上映される。
    image: /works/assets/thumbnail-fragment2.jpg
    image_alt: 『映像的断片 2』

  - year: '2023'
    title: 『はしのはなし』
    category: orion
    type: 映像
    description: 特徴的な形の橋を舞台にした短編映像作品。 すでにあった原案をもとに、橋の形から着想を得た「運命」というテーマで、橋を両端から中央に向かう⼆⼈の会話で構成される脚本を作成し、15分⻑回しの撮影に挑戦した。ロケ地とテーマと⼿法の融合を考えていた。 京都の学⽣中⼼のインディーズ映画祭「スポットライト映画祭」第⼀回にノミネート‧上映された。
    image: /works/assets/thumbnail-hashinohanashi.jpg
    image_alt: 『はしのはなし』
    related_links:
      - label: 「第1回スポットライト映画祭」ウェブサイト
        url: https://kyotospotlight.wixsite.com/spotlight-mofes
    videos:
      - title: 『はしのはなし』本編映像
        embed: https://youtube.com/embed/9qdj6QTBnIM

  - year: '2023'
    title: 建築測量演習課題
    category: university
    type: 建築
    description: 大学内のいくつかの建築空間や外構を測量し図面に起こす課題。画像はグラウンド脇でたまり場になりやすい場所の良さを解剖しようと測量し図面化した場所。
    image: /works/assets/thumbnail-survey.JPG
    image_alt: 建築測量演習課題

  - year: '2023'
    title: メディアセンター設計課題
    category: university
    type: 建築
    description: 敷地である元待賢小学校は1930年代の竣工であり、建築史的な観点と住民の意識の観点の両方から、この校舎の歴史的価値がうかがえる。ところが、周辺のビルやマンションの開発によって存在がかすんで見えるとともに、大通りから見る校舎はもはや"壁"であり、周辺の住宅街との隔絶が感じられる。そこで、歴史的価値を残しつつ、現在の周辺環境とのつながりをつくるために、「道」の貫入による校舎のコンバージョンを構想した。
    image: /works/assets/thumbnail-mediacenter.JPG
    image_alt: メディアセンター設計課題

  - year: '2022'
    title: 『夏へのフィルム』
    category: orion
    type: 映像
    description: 「記録」と「記憶」がテーマの自主制作映画。制作の進行をする。
    image: /works/assets/thumbnail-filmintosummer.jpg
    image_alt: 『夏へのフィルム』

  - year: '2022'
    title: 『映像的断片 1』
    category: orion
    type: 映像
    description: モノやストーリーを意図的に崩壊させた実験的な映像作品。2人で制作する。
    image: /works/assets/thumbnail-fragment1.jpg
    image_alt: 『映像的断片 1』

  - year: '2022'
    title: 『コーラフロート』
    category: orion
    type: 映像
    description: もどかしい恋愛を描いた自主制作映画。絵コンテの作成、撮影計画、撮影、編集をする。
    image: /works/assets/thumbnail-corafloat.jpg
    image_alt: 『コーラフロート』

  - year: '2022'
    title: 保育園設計課題
    category: university
    type: 建築
    description: 四方を囲まれた「部屋」ではなく、二面の壁によって挟まれたあいまいな領域に「保育室」や「遊戯室」「トイレ」などの機能をあてはめた。利用者は、壁に空いた大きなアーチを介して領域を横断しつつ動き回る。
    image: /works/assets/thumbnail-hoikuenn.JPG
    image_alt: 保育園設計課題

  - year: '2022'
    title: 集合住宅設計課題
    category: university
    type: 建築
    description: 共同体的なものが氷解し、個人と公に分裂した社会の中で、個人が心理的に自分の場所を持ちつつ、生活空間を共有するアパートを構想した。
    image: /works/assets/thumbnail-apartment.JPG
    image_alt: 集合住宅設計課題

  - year: '2022'
    title: カフェ設計課題
    category: university
    type: 建築
    description: 敷地である大学の中庭の良い所は、もとからある構造物の起伏と周辺の草木によって、適度な囲まれ感があることである。しかも、そうした場所が人によって複数ある。ここにできるカフェでは、そうしたもとの構造物と草木がなす空間性が多く残されているべきだと考える。その上で、この中庭全体に新たな空間の秩序をつくることを目指した。
    image: /assets/thumbnail-kadai.JPG
    image_alt: カフェ設計課題

  - year: '2022'
    title: 空間デザイン基礎課題
    category: university
    type: 空間
    description: 石をモチーフに、宝ヶ池公園に滞在するスペースを構想する。拾ってきた石は角ばりながら、多数の平らな面を持っていた。この石の形成過程に注目し、かつてそうだった形、そこにかかった力を想像して第二の表面を考えた。
    image: /works/assets/thumbnail-stone.JPG
    image_alt: 空間デザイン基礎課題

  - year: '2021'
    title: ポスターデザイン課題
    category: university
    type: デザイン
    description: 日本美術の要素を用いて、現代のポスターを制作する課題。「慧可断臂図」をモチーフにして、職人的な仕事をする工場（コウバ）の祭典を想定し制作した。
    image: /works/assets/thumbnail-poster.JPG
    image_alt: ポスターデザイン課題

  - year: '2021'
    title: モーター課題
    category: university
    type: 造形
    description: モーターを自作し、その動力を用いて何かしらの機能を持ったものを制作する課題。水を張り、それをモーターによって震わせることで、そこに当てた光の揺らぎを楽しむものを制作した。
    image: /works/assets/thumbnail-motor.jpg
    image_alt: モーター課題
    videos:
      - title: モーター課題の映像
        embed: https://youtube.com/embed/yqB6GP9p224

  - year: '2021'
    title: 映画の構図を模写する課題
    category: university
    type: 映像
    description: 映画の場面を模写し、そのビジュアル的な構図や明暗のバランスを理解する課題。題材にしたのは映画『タクシードライバー』。
    image: /works/assets/thumbnail-movie.JPG
    image_alt: 映画の構図を模写する課題

  - year: '2021'
    title: 英語の授業での簡単な建築を構想する課題
    category: university
    type: 建築
    description: ベルギーの学生と共同で、日本の「間」の概念を取り入れ、ベルギーの敷地に何かを構想する課題。内と外があいまいになる休憩所のようなものを構想した。
    image: /works/assets/thumbnail-english.JPG
    image_alt: 英語の授業での簡単な建築を構想する課題

  - year: '2021'
    title: 立体構成基礎課題
    category: university
    type: 造形
    description: 立方体を2つ結合し、図面に起こす課題。調和的に見える側面と、非調和的に見える側面があるアンビバレントな立体を制作した。
    image: /works/assets/thumbnail-object.JPG
    image_alt: 立体構成基礎課題

  - year: '2021'
    title: ロゴデザイン課題
    category: university
    type: デザイン
    description: 何かしらのロゴを制作する課題。「日本きのこ学会」を題材にして、地味だが大事な発見のあるきのこに関する研究の先駆性を表現した。
    image: /works/assets/thumbnail-logo.JPG
    image_alt: ロゴデザイン課題

  - year: '2021'
    title: パターンデザイン課題
    category: university
    type: デザイン
    description: 植物をモチーフに反復するビジュアルパターンを作る課題。遠くから見たときの印象と近くから見たときの印象が変わるような色味やパターンを考え、壁紙のようなものとして作った。
    image: /works/assets/thumbnail-pattern.JPG
    image_alt: パターンデザイン課題

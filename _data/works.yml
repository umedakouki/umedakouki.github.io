categories:
  plantshop:
    label: プラントショップ
    url: /works/categories/plantshop.html
    description: さまざまな分野を横断し、持続的に制作・展示・販売を行うためのコレクティブ「プラントショップ」で活動している。
    links:
      - label: プラントショップの公式ウェブサイト
        url: https://plantshop.work
  orion:
    label: オリヲン座
    url: /works/categories/orion.html
    description: 映像制作・鑑賞会・上映などをする「映像研究会オリヲン座」での活動や作品をまとめている。
  university:
    label: 大学の課題
    url: /works/categories/university.html
    description: 大学で制作した、ポスター、オブジェクト、建築設計、都市史調査、建築資料アーカイブと展示など。

works:
  - year: '2026'
    title: 展示「生産」
    category: plantshop
    type: 展示
    url: /works/plantshop/seisan.html
    description: >-
      「プラントショップ」の最初の活動として、自分たちにとってもっとも基本的な行為である「作る」ということを、あらためて見つめ直すことにした。社会の中で「作る」ことは、しばしば「生産」という言葉に置き換えられる。しかし、生産とは、価値ある商品や作品を新しく生み出すことだけなのだろうか。何かを選び、捨て、残し、整えること。普段は見過ごしているものに気づくこと。生活の中の小さな違和感や、手元の所作、物の変化を捉え直すこと。そうした行為もまた、私たちの日常を作り出しているのではないかと考えた。
    image: /works/assets/thumbnail-seisan.png
    image_alt: 展示「生産」
    related_links:
      - label: プラントショップの「生産」ページ
        url: https://www.plantshop.work/work.html?id=production

  - year: '2026'
    title: 『メルトロンの日常』
    category: orion
    type: 映像
    description: 『GELEL』のスピンオフ作品。怪獣メルトロンが人間の大学生生活に溶け込んでいる設定である。簡単な絵コンテ作成、撮影を依頼され受ける。

  - year: '2026'
    title: 『とある男の物語』
    category: orion
    type: 映像
    description: 3つの章が入れ替え可能なため、映画は全６通り存在し、それぞれで因果・解釈が変化する作品。知り合いである田中智裕が大学の卒業制作で取り組んだ映画であり、撮影を依頼され受ける。卒業制作展にて審査員賞を受賞。

  - year: '2025'
    title: 『GELEL』
    category: orion
    type: 映像・美術
    url: /works/gelel.html
    description: 映像研究会オリヲン座での作品。怪獣と巨人が戦い、防衛隊と駆け引きをする自主怪獣特撮映画。担当は主に美術で、特に京都駅前の街並みを模したジオラマや、それを支える土台等の設計・制作を行った。京都工芸繊維大学学祭での展示、コミュニティスペース「5.6」、イベント「kougei noel」、「全国自主怪獣映画選手権 特撮のまち・須賀川大会」にて上映された。自主怪獣映画選手権では田口清隆賞を受賞した。
    image: /assets/thumbnail-gelel.avif
    image_alt: 『GELEL』のジオラマ

  - year: 2023-2025
    title: 「ダイアローグ4.9」「ビデオローグス」
    category: orion
    type: 音声・映像
    description: オリヲン座での制作活動をレポートしつつ雑談する形式のラジオ「ダイアローグ4.9」と、その後続の「ビデオローグス」。企画、編集をする。
    image: /works/assets/thumbnail-dialog.jpg
    image_alt: 「ダイアローグ4.9」「ビデオローグス」
    related_links:
      - label: 「ダイアローグ4.9」再生リスト
        url: https://youtube.com/playlist?list=PL8EGAufEhVIDMI4M4p04asEgUGOH1-8Sx&si=zIYQ60k9dpzG6Hvg
      - label: 「ビデオローグス」再生リスト
        url: https://youtube.com/playlist?list=PL8EGAufEhVIBft798ho31TA0XKaJo_n2J&si=lolsYvc-SH3kegtG

  - year: '2025'
    title: 『ふるまいの模型』
    category: university
    type: 建築
    url: /works/furumainomokei.html
    description: 大学の卒業制作。都市の小さな記憶を共有するための演劇、その仮設劇場の構想。都市や建築に潜む無意識的な意味を、地域のふるまいと空間の関係から読み解くことを考えた。演劇の模倣性を手がかりに、その地域固有の空間の型を「ふるまいの模型」として抽出し、劇場設計へ展開した。 同年の京都工芸繊維大学 卒業・終了研究展にて展示された。
    image: /assets/thumbnail-furumai.jpg
    image_alt: 『ふるまいの模型』展示風景


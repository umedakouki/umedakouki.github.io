<!DOCTYPE html>
<html lang="ja">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BWMWLYXC3T"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-BWMWLYXC3T');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/garden-ui.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <title>{% if page.title and page.url != '/' %}{{ page.title | escape }} | {% endif %}Garden</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
</head>
<body class="garden-site" id="top">
  <div class="site-shell">
    <aside class="site-rail">
      <a class="site-name" href="{{ '/' | relative_url }}">Garden</a>
      <nav aria-label="主要な目次"><a href="{{ '/' | relative_url }}">ページ</a></nav>
    </aside>
    <div class="page">
      <main>{{ content }}</main>
      <footer class="site-footer">&copy; {{ site.time | date: '%Y' }} 梅田航輝</footer>
    </div>
  </div>
</body>
</html>

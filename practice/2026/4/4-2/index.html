<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fog Reveal</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dcdcdc;
      font-family: sans-serif;
      touch-action: none;
    }

    .page {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px 0 28px;
    }

    .viewer {
      position: relative;
      width: 90vw;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
      user-select: none;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #fogCanvas {
      pointer-events: auto;
      touch-action: none;
      cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      background: #f7f7f7;
      font-size: 16px;
      cursor: pointer;
    }

    .label {
      font-size: 14px;
      color: #666;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="viewer" class="viewer">
      <canvas id="imageCanvas"></canvas>
      <canvas id="fogCanvas"></canvas>
    </div>

    <div class="controls">
      <button id="nextBtn">次へ</button>
      <div id="label" class="label"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fgwcvpxxxvbzkloujzoz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnd2N2cHh4eHZiemtsb3Vqem96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMTY0MzksImV4cCI6MjA4OTY5MjQzOX0.3xoh1lMhbSg4VDtnG9trMK9OB8JVWOMjKLlPtnztBnE";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TOTAL_IMAGES = 16;
    const IMAGE_PATHS = Array.from(
      { length: TOTAL_IMAGES },
      (_, i) => `assets/4-2 (${i + 1}).JPG`
    );

    const viewer = document.getElementById("viewer");
    const imageCanvas = document.getElementById("imageCanvas");
    const fogCanvas = document.getElementById("fogCanvas");
    const imgCtx = imageCanvas.getContext("2d");
    const fogCtx = fogCanvas.getContext("2d");
    const nextBtn = document.getElementById("nextBtn");
    const label = document.getElementById("label");

    let currentImage = null;
    let currentIndex = -1;

    let width = 0;
    let height = 0;

    const FIELD_SCALE = 0.22;
    let fieldW = 0;
    let fieldH = 0;
    let revealField = null;
    let blurFieldA = null;
    let blurFieldB = null;
    let blurTemp = null;

    const pointers = new Map();

    const REVEAL_RADIUS_PX = 100;
    const FULL_REVEAL_SECONDS = 10;
    const FADEOUT_SECONDS = 600;
    const EDGE_POWER = 1.7;
    const POINTERDOWN_BOOST = 0.12;
    const BLUR_PASSES = 2;
    const AUTOSAVE_MS = 2000;

    let lastTime = performance.now();
    let lastAutosaveAt = 0;
    let saveInFlight = false;

    function resizeCanvases() {
      const rect = viewer.getBoundingClientRect();
      width = Math.round(rect.width);
      height = Math.round(rect.height);

      imageCanvas.width = width;
      imageCanvas.height = height;
      fogCanvas.width = width;
      fogCanvas.height = height;

      const oldFieldW = fieldW;
      const oldFieldH = fieldH;
      const oldReveal = revealField ? new Float32Array(revealField) : null;

      fieldW = Math.max(48, Math.round(width * FIELD_SCALE));
      fieldH = Math.max(27, Math.round(height * FIELD_SCALE));

      revealField = new Float32Array(fieldW * fieldH);
      blurFieldA = new Float32Array(fieldW * fieldH);
      blurFieldB = new Float32Array(fieldW * fieldH);
      blurTemp = new Float32Array(fieldW * fieldH);

      if (oldReveal && oldFieldW > 0 && oldFieldH > 0) {
        remapRevealField(oldReveal, oldFieldW, oldFieldH, revealField, fieldW, fieldH);
      }

      drawImageLayer();
      drawFogLayer();
    }

    function remapRevealField(src, srcW, srcH, dst, dstW, dstH) {
      for (let y = 0; y < dstH; y++) {
        for (let x = 0; x < dstW; x++) {
          const sx = Math.floor((x / dstW) * srcW);
          const sy = Math.floor((y / dstH) * srcH);
          dst[y * dstW + x] = src[Math.min(srcH - 1, sy) * srcW + Math.min(srcW - 1, sx)];
        }
      }
    }

    function resetRevealField() {
      revealField.fill(0);
      blurFieldA.fill(0);
      blurFieldB.fill(0);
      blurTemp.fill(0);
    }

    function pickRandomIndex(exclude) {
      if (IMAGE_PATHS.length <= 1) return 0;
      let idx;
      do {
        idx = Math.floor(Math.random() * IMAGE_PATHS.length);
      } while (idx === exclude);
      return idx;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`画像を読み込めません: ${src}`));
        img.src = src;
      });
    }

    function drawImageLayer() {
      imgCtx.clearRect(0, 0, width, height);
      if (!currentImage) return;

      const iw = currentImage.naturalWidth;
      const ih = currentImage.naturalHeight;
      const ir = iw / ih;
      const cr = width / height;

      let dw, dh, dx, dy;

      if (ir > cr) {
        dw = width;
        dh = dw / ir;
        dx = 0;
        dy = (height - dh) / 2;
      } else {
        dh = height;
        dw = dh * ir;
        dx = (width - dw) / 2;
        dy = 0;
      }

      imgCtx.drawImage(currentImage, dx, dy, dw, dh);
    }

    function addRevealAt(x, y, dt, extraBoost = 0) {
      const fx = (x / width) * fieldW;
      const fy = (y / height) * fieldH;
      const radius = (REVEAL_RADIUS_PX / width) * fieldW;

      const minX = Math.max(0, Math.floor(fx - radius - 1));
      const maxX = Math.min(fieldW - 1, Math.ceil(fx + radius + 1));
      const minY = Math.max(0, Math.floor(fy - radius - 1));
      const maxY = Math.min(fieldH - 1, Math.ceil(fy + radius + 1));

      const revealRate = 1 / FULL_REVEAL_SECONDS;

      for (let yy = minY; yy <= maxY; yy++) {
        for (let xx = minX; xx <= maxX; xx++) {
          const dx = xx - fx;
          const dy = yy - fy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > radius) continue;

          const t = 1 - dist / radius;
          const strength = Math.pow(t, EDGE_POWER);

          const idx = yy * fieldW + xx;
          let v = revealField[idx] + (revealRate * strength * dt) + (extraBoost * strength);
          if (v > 1) v = 1;
          revealField[idx] = v;
        }
      }
    }

    function decayRevealField(dt) {
      const decay = dt / FADEOUT_SECONDS;
      for (let i = 0; i < revealField.length; i++) {
        let v = revealField[i] - decay;
        if (v < 0) v = 0;
        revealField[i] = v;
      }
    }

    function blurOnce(src, temp, dst) {
      for (let y = 0; y < fieldH; y++) {
        for (let x = 0; x < fieldW; x++) {
          let sum = 0;
          let count = 0;
          for (let k = -2; k <= 2; k++) {
            const xx = x + k;
            if (xx < 0 || xx >= fieldW) continue;
            sum += src[y * fieldW + xx];
            count++;
          }
          temp[y * fieldW + x] = sum / count;
        }
      }

      for (let y = 0; y < fieldH; y++) {
        for (let x = 0; x < fieldW; x++) {
          let sum = 0;
          let count = 0;
          for (let k = -2; k <= 2; k++) {
            const yy = y + k;
            if (yy < 0 || yy >= fieldH) continue;
            sum += temp[yy * fieldW + x];
            count++;
          }
          dst[y * fieldW + x] = sum / count;
        }
      }
    }

    function buildBlurField() {
      blurFieldA.set(revealField);
      for (let i = 0; i < BLUR_PASSES; i++) {
        blurOnce(blurFieldA, blurTemp, blurFieldB);
        blurFieldA.set(blurFieldB);
      }
    }

    function drawFogLayer() {
      fogCtx.clearRect(0, 0, width, height);

      fogCtx.globalCompositeOperation = "source-over";
      fogCtx.fillStyle = "#ffffff";
      fogCtx.fillRect(0, 0, width, height);

      buildBlurField();

      fogCtx.globalCompositeOperation = "destination-out";

      const cellW = width / fieldW;
      const cellH = height / fieldH;

      for (let y = 0; y < fieldH; y++) {
        for (let x = 0; x < fieldW; x++) {
          const reveal = blurFieldA[y * fieldW + x];
          if (reveal <= 0.001) continue;

          fogCtx.fillStyle = `rgba(0,0,0,${reveal})`;
          fogCtx.fillRect(x * cellW, y * cellH, cellW + 1, cellH + 1);
        }
      }

      fogCtx.globalCompositeOperation = "source-over";
    }

    function getLocalPoint(clientX, clientY) {
      const rect = fogCanvas.getBoundingClientRect();
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function encodeFieldToBase64() {
      const bytes = new Uint8Array(revealField.length);
      for (let i = 0; i < revealField.length; i++) {
        let v = Math.round(revealField[i] * 255);
        if (v < 0) v = 0;
        if (v > 255) v = 255;
        bytes[i] = v;
      }

      let binary = "";
      const chunkSize = 8192;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode(...chunk);
      }
      return btoa(binary);
    }

    function decodeBase64ToField(base64) {
      const binary = atob(base64);
      const len = Math.min(binary.length, revealField.length);

      revealField.fill(0);

      for (let i = 0; i < len; i++) {
        revealField[i] = binary.charCodeAt(i) / 255;
      }
    }

    function applyElapsedDecay(updatedAtIso) {
      if (!updatedAtIso) return;

      const updatedAtMs = new Date(updatedAtIso).getTime();
      if (!Number.isFinite(updatedAtMs)) return;

      const elapsedSec = Math.max(0, (Date.now() - updatedAtMs) / 1000);
      const decay = elapsedSec / FADEOUT_SECONDS;

      for (let i = 0; i < revealField.length; i++) {
        let v = revealField[i] - decay;
        if (v < 0) v = 0;
        revealField[i] = v;
      }
    }

    async function loadStateFromSupabase(imageKey) {
      resetRevealField();

      const { data, error } = await supabaseClient
        .from("fog_states")
        .select("image_key, field_w, field_h, data, updated_at")
        .eq("image_key", imageKey)
        .maybeSingle();

      if (error) {
        console.error("Supabase load error:", error);
        return;
      }

      if (!data) return;

      // 保存時と画面サイズが違っても復元できるように簡易リサイズ
      const savedW = data.field_w;
      const savedH = data.field_h;

      if (!savedW || !savedH || !data.data) return;

      const binary = atob(data.data);
      const savedField = new Float32Array(savedW * savedH);
      for (let i = 0; i < Math.min(binary.length, savedField.length); i++) {
        savedField[i] = binary.charCodeAt(i) / 255;
      }

      remapRevealField(savedField, savedW, savedH, revealField, fieldW, fieldH);
      applyElapsedDecay(data.updated_at);
    }

    async function saveStateToSupabase() {
      if (currentIndex < 0 || saveInFlight) return;

      saveInFlight = true;

      const payload = {
        image_key: IMAGE_PATHS[currentIndex],
        field_w: fieldW,
        field_h: fieldH,
        data: encodeFieldToBase64(),
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient
        .from("fog_states")
        .upsert(payload, { onConflict: "image_key" });

      if (error) {
        console.error("Supabase save error:", error);
      }

      saveInFlight = false;
    }

    function updateLabel() {
      if (currentIndex < 0) {
        label.textContent = "";
        return;
      }
      label.textContent = IMAGE_PATHS[currentIndex];
    }

    async function showRandomImage() {
      await saveStateToSupabase();

      currentIndex = pickRandomIndex(currentIndex);

      try {
        currentImage = await loadImage(IMAGE_PATHS[currentIndex]);
        await loadStateFromSupabase(IMAGE_PATHS[currentIndex]);
        drawImageLayer();
        drawFogLayer();
        updateLabel();
      } catch (err) {
        console.error(err);
        label.textContent = `読み込み失敗: ${IMAGE_PATHS[currentIndex]}`;
      }
    }

    function onPointerDown(e) {
      const p = getLocalPoint(e.clientX, e.clientY);
      pointers.set(e.pointerId, { x: p.x, y: p.y });

      addRevealAt(p.x, p.y, 0, POINTERDOWN_BOOST);
      drawFogLayer();
      saveStateToSupabase();

      try {
        fogCanvas.setPointerCapture(e.pointerId);
      } catch (_) {}

      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!pointers.has(e.pointerId)) return;
      const p = getLocalPoint(e.clientX, e.clientY);
      pointers.set(e.pointerId, { x: p.x, y: p.y });
      e.preventDefault();
    }

    function onPointerUpOrCancel(e) {
      pointers.delete(e.pointerId);
      saveStateToSupabase();
      e.preventDefault();
    }

    fogCanvas.addEventListener("pointerdown", onPointerDown, { passive: false });
    fogCanvas.addEventListener("pointermove", onPointerMove, { passive: false });
    fogCanvas.addEventListener("pointerup", onPointerUpOrCancel, { passive: false });
    fogCanvas.addEventListener("pointercancel", onPointerUpOrCancel, { passive: false });

    nextBtn.addEventListener("click", async () => {
      pointers.clear();
      await showRandomImage();
    });

    window.addEventListener("resize", () => {
      resizeCanvases();
      if (currentImage) {
        drawImageLayer();
        drawFogLayer();
        updateLabel();
      }
    });

    window.addEventListener("beforeunload", () => {
      saveStateToSupabase();
    });

    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      decayRevealField(dt);

      for (const p of pointers.values()) {
        addRevealAt(p.x, p.y, dt, 0);
      }

      drawFogLayer();

      if (now - lastAutosaveAt > AUTOSAVE_MS) {
        saveStateToSupabase();
        lastAutosaveAt = now;
      }

      requestAnimationFrame(animate);
    }

    async function init() {
      resizeCanvases();
      await showRandomImage();
      updateLabel();
      lastTime = performance.now();
      lastAutosaveAt = lastTime;
      requestAnimationFrame(animate);
    }

    init();
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Panorama Audio Window</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="topBar">
      <button id="startBtn" type="button">Start</button>
      <div class="info">
        <span>time: <b id="t">0.0</b>s / 60.0s</span>
        <span>set: <b id="s">-</b></span>
        <span>region: <b id="r">-</b></span>
      </div>
    </div>

    <p class="lead">
      横にスワイプすると風景が動きます。左上の「Start」を押すと、その視線の反対方向の音が流れます。気になる音があれば「振り返る」ボタンで振り返ろう。
    </p>
  </header>

  <main class="app">
    <section class="carouselSection" aria-label="panorama carousel">
      <div class="carouselViewport" id="carouselViewport">
        <div class="carouselTrack" id="carouselTrack">
          <article class="slide" data-index="0">
            <div class="slideHeader">A: 修学院</div>
            <div class="panoFrame">
              <div class="pano" id="panoA" aria-label="panorama A"></div>
            </div>
          </article>

          <article class="slide" data-index="1">
            <div class="slideHeader">B: 一乗寺</div>
            <div class="panoFrame">
              <div class="pano" id="panoB" aria-label="panorama B"></div>
            </div>
          </article>

          <article class="slide" data-index="2">
            <div class="slideHeader">C: 北白川</div>
            <div class="panoFrame">
              <div class="pano" id="panoC" aria-label="panorama C"></div>
            </div>
          </article>

          <article class="slide recordSlide" data-index="3">
            <div class="slideHeader">記録</div>
            <section class="recordPanel" aria-label="turn records">
              <p class="recordLead">
                振り返った瞬間の記録です。パノラマ、振り返る前の視線、振り返った視線、時刻を一覧で確認できます。
              </p>

              <div class="recordToolbar">
                <div class="recordMeta">
                  <span>count: <b id="recordCount">0</b></span>
                </div>
                <button id="feedbackBtn" type="button" class="subBtn">記録をフィードバック</button>
              </div>

              <div class="recordTableWrap">
                <table class="recordTable">
                  <thead>
                    <tr>
                      <th>パノラマ</th>
                      <th>振り返る前の視線</th>
                      <th>振り返った視線</th>
                      <th>秒数</th>
                    </tr>
                  </thead>
                  <tbody id="recordTableBody">
                    <tr id="recordEmptyRow">
                      <td colspan="4" class="recordEmptyCell">まだ記録はありません。</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div class="sheetLinkWrap">
                <a
                  class="sheetLink"
                  href="https://docs.google.com/spreadsheets/d/11SynJ8POywhOscIuIDKAhobtZp7sW9G8GzCGN9ZYpQc/edit?usp=sharing"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  フィードバック一覧を確認する（スプレッドシート）
                </a>
              </div>
            </section>
          </article>
        </div>
      </div>

      <div class="dots" id="dots" aria-label="carousel pagination">
        <button class="dot isActive" type="button" aria-label="A: 修学院を表示" data-index="0"></button>
        <button class="dot" type="button" aria-label="B: 一乗寺を表示" data-index="1"></button>
        <button class="dot" type="button" aria-label="C: 北白川を表示" data-index="2"></button>
        <button class="dot" type="button" aria-label="記録を表示" data-index="3"></button>
      </div>
    </section>
  </main>

  <div class="bottomBar">
    <button id="turnBtn" type="button">振り返る</button>
  </div>

  <script src="app.js"></script>
</body>
</html>

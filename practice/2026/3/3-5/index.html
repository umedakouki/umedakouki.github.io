<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>front / back viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="row">
      <button id="startBtn" type="button">Start</button>
      <button id="turnBtn" type="button" disabled>振り返る</button>
    </div>

    <div class="row sets">
      <button class="setBtn active" data-set="0" type="button">A</button>
      <button class="setBtn" data-set="1" type="button">B</button>
      <button class="setBtn" data-set="2" type="button">C</button>
    </div>

    <div class="status">
      <span>set: <b id="setLabel">A</b></span>
      <span>view: <b id="viewLabel">front</b></span>
      <span>x: <b id="posLabel">50</b>%</span>
    </div>
  </header>

  <main class="main">
    <div class="window" id="window">
      <video id="videoFront" class="video active" playsinline muted loop preload="auto"></video>
      <video id="videoBack" class="video" playsinline muted loop preload="auto"></video>
    </div>
  </main>

  <audio id="audioEl" preload="auto" loop></audio>

  <script src="app.js"></script>
</body>
</html>

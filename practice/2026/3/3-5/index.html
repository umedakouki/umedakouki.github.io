<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Wide View Audio Window</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="topBar">
      <button id="startBtn" type="button">Start</button>
      <div class="info">
        <span>set: <b id="setLabel">A</b></span>
        <span>side: <b id="sideLabel">front</b></span>
        <span>x: <b id="posLabel">50</b>%</span>
      </div>
    </div>

    <p class="lead">
      横にスワイプすると、1:3 の映像の見える位置が動きます。振り返るボタンで、ちょうど180度反対側の映像に切り替わります。
    </p>
  </header>

  <main class="app">
    <section class="carouselSection">
      <div class="carouselViewport" id="carouselViewport">
        <div class="carouselTrack" id="carouselTrack">

          <article class="slide">
            <div class="slideHeader">A</div>
            <div class="sceneWindow" data-set-index="0">
              <div class="sceneStage" id="stageA">
                <div class="viewLayer isActive">
                  <video class="viewVideo" id="a1Video" playsinline preload="auto" muted loop>
                    <source src="assets/a1-view.mp4" type="video/mp4">
                  </video>
                </div>
                <div class="viewLayer">
                  <video class="viewVideo" id="a2Video" playsinline preload="auto" muted loop>
                    <source src="assets/a2-view.mp4" type="video/mp4">
                  </video>
                </div>
              </div>
            </div>
          </article>

          <article class="slide">
            <div class="slideHeader">B</div>
            <div class="sceneWindow" data-set-index="1">
              <div class="sceneStage" id="stageB">
                <div class="viewLayer isActive">
                  <video class="viewVideo" id="b1Video" playsinline preload="auto" muted loop>
                    <source src="assets/b1-view.mp4" type="video/mp4">
                  </video>
                </div>
                <div class="viewLayer">
                  <video class="viewVideo" id="b2Video" playsinline preload="auto" muted loop>
                    <source src="assets/b2-view.mp4" type="video/mp4">
                  </video>
                </div>
              </div>
            </div>
          </article>

          <article class="slide">
            <div class="slideHeader">C</div>
            <div class="sceneWindow" data-set-index="2">
              <div class="sceneStage" id="stageC">
                <div class="viewLayer isActive">
                  <video class="viewVideo" id="c1Video" playsinline preload="auto" muted loop>
                    <source src="assets/c1-view.mp4" type="video/mp4">
                  </video>
                </div>
                <div class="viewLayer">
                  <video class="viewVideo" id="c2Video" playsinline preload="auto" muted loop>
                    <source src="assets/c2-view.mp4" type="video/mp4">
                  </video>
                </div>
              </div>
            </div>
          </article>

        </div>
      </div>

      <div class="dots">
        <button class="dot isActive" type="button" data-index="0"></button>
        <button class="dot" type="button" data-index="1"></button>
        <button class="dot" type="button" data-index="2"></button>
      </div>
    </section>
  </main>

  <div class="bottomBar">
    <button id="turnBtn" type="button">振り返る</button>
  </div>

  <!-- 音声 -->
  <audio id="a1Audio" preload="auto" loop src="assets/a1-sound.mp3"></audio>
  <audio id="a2Audio" preload="auto" loop src="assets/a2-sound.mp3"></audio>
  <audio id="b1Audio" preload="auto" loop src="assets/b1-sound.mp3"></audio>
  <audio id="b2Audio" preload="auto" loop src="assets/b2-sound.mp3"></audio>
  <audio id="c1Audio" preload="auto" loop src="assets/c1-sound.mp3"></audio>
  <audio id="c2Audio" preload="auto" loop src="assets/c2-sound.mp3"></audio>

  <script src="app.js"></script>
</body>
</html>
